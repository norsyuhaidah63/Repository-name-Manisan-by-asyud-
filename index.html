
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manisan by Asyud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --pink:#e98eae;
  --pink-dark:#c95783;
  --pink-light:#fff0f5;
  --cream:#fffaf8;
  --text:#49333d;
  --muted:#927c86;
  --white:#fff;
  --border:#f2dce5;
  --danger:#c84355;
  --shadow:0 8px 28px #d99db51a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--text);font-family:Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{
  height:68px;background:white;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 20px;
  position:sticky;top:0;z-index:20
}
.brand{font-weight:800;font-size:19px;color:var(--pink-dark);flex:1}
.hamburger{border:0;background:var(--pink-light);color:var(--pink-dark);
  border-radius:12px;padding:10px 13px;font-size:23px}
.user-label{font-size:12px;color:var(--muted);max-width:120px;overflow:hidden}
.app{display:flex;min-height:calc(100vh - 68px)}
.sidebar{
  width:245px;background:white;border-right:1px solid var(--border);
  padding:20px 13px;flex-shrink:0;transition:transform .2s
}
.side-heading{font-size:11px;color:var(--muted);padding:10px 12px;letter-spacing:1px}
.nav-btn{width:100%;border:0;background:transparent;text-align:left;
  padding:13px 14px;margin:3px 0;border-radius:12px;color:var(--text);
  display:flex;gap:12px;align-items:center}
.nav-btn:hover,.nav-btn.active{background:var(--pink-light);color:var(--pink-dark);font-weight:700}
.main{flex:1;min-width:0;padding:28px;width:100%;max-width:1500px;margin:auto}
.page-title{margin:0 0 7px;font-size:27px}
.subtitle{color:var(--muted);margin:0 0 24px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:24px}
.stat{background:white;border:1px solid var(--border);border-radius:17px;padding:20px;box-shadow:var(--shadow)}
.stat-label{font-size:13px;color:var(--muted)}
.stat-value{font-size:25px;font-weight:800;margin-top:12px;color:var(--pink-dark);overflow-wrap:anywhere}
.panel{background:white;border:1px solid var(--border);border-radius:17px;padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.panel-head h2{margin:0;font-size:18px}
.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}
.btn-primary{background:var(--pink-dark);color:white}
.btn-light{background:var(--pink-light);color:var(--pink-dark)}
.btn-danger{background:#fff0f0;color:var(--danger)}
.btn-small{padding:7px 10px;font-size:12px;margin:2px}
.table-wrap{width:100%;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:13px}
th,td{padding:13px 11px;text-align:left;border-bottom:1px solid #f5e7ed;vertical-align:top}
th{background:#fff8fb;color:var(--muted);font-weight:700}
td{overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:28px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:700}
.field input,.field select,.field textarea,.search{
  width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;
  outline:none;background:white;color:var(--text)
}
.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--pink)}
.field textarea{min-height:85px;resize:vertical}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.actions{white-space:nowrap}
.overlay{position:fixed;inset:0;background:#38232d66;z-index:50;display:flex;
  align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal{background:white;border-radius:18px;padding:23px;width:100%;max-width:620px;
  max-height:92vh;overflow-y:auto;box-shadow:0 20px 70px #0002}
.modal h2{margin:0 0 20px}
.hidden{display:none!important}
.notice{padding:12px 14px;border-radius:10px;margin:12px 0;font-size:13px}
.notice.error{background:#fff0f0;color:#a52d40}
.notice.success{background:#eefaf1;color:#247443}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(140deg,#fff0f5,#fffaf8)}
.login-card{background:white;padding:30px;border-radius:22px;width:100%;max-width:420px;
  box-shadow:var(--shadow);border:1px solid var(--border)}
.login-card h1{color:var(--pink-dark);font-size:25px;margin:0 0 8px}
.login-card p{color:var(--muted);font-size:13px;line-height:1.6}
.login-card .field{margin:16px 0}
.login-card .btn{width:100%;margin-top:8px}
.backdrop{display:none}
@media(max-width:760px){
  .topbar{padding:0 12px;height:62px}
  .brand{font-size:16px}
  .user-label{display:none}
  .app{min-height:calc(100vh - 62px)}
  .sidebar{position:fixed;z-index:30;top:62px;bottom:0;left:0;width:270px;
    transform:translateX(-105%);box-shadow:none;overflow-y:auto}
  .sidebar.open{transform:translateX(0);box-shadow:10px 0 30px #0001}
  .backdrop.show{display:block;position:fixed;inset:62px 0 0;z-index:25;background:#38232d55}
  .main{padding:18px 13px}
  .page-title{font-size:23px}
  .cards{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:15px}
  .stat-value{font-size:21px}
  .panel{padding:14px}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
}
@media(max-width:380px){.cards{grid-template-columns:1fr}.brand{font-size:14px}}
</style>
</head>
<body>

<div id="loginPage" class="login-page">
  <div class="login-card">
    <h1>🍰 Manisan by Asyud</h1>
    <p>Sistem pengurusan produk, stok, jualan, perbelanjaan dan pelanggan.</p>
    <div id="authNotice"></div>
    <form id="authForm">
      <div class="field">
        <label for="authEmail">E-mel</label>
        <input id="authEmail" type="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="authPassword">Kata laluan</label>
        <input id="authPassword" type="password" required minlength="6" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="submit" id="loginBtn">Log masuk</button>
      <button class="btn btn-light" type="button" id="registerBtn">Daftar akaun baharu</button>
    </form>
  </div>
</div>

<div id="appPage" class="hidden">
  <header class="topbar">
    <button class="hamburger" id="menuToggle" aria-label="Buka menu" aria-expanded="false">☰</button>
    <div class="brand">🍰 Manisan by Asyud</div>
    <span class="user-label" id="userEmail"></span>
    <button class="btn btn-light" id="logoutBtn">Keluar</button>
  </header>
  <div id="backdrop" class="backdrop"></div>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="side-heading">MENU UTAMA</div>
      <button class="nav-btn active" data-page="dashboard">🏠 Dashboard</button>
      <button class="nav-btn" data-page="products">🍰 Produk</button>
      <button class="nav-btn" data-page="ingredients">📦 Stok bahan</button>
      <button class="nav-btn" data-page="sales">💰 Jualan</button>
      <button class="nav-btn" data-page="expenses">🧾 Perbelanjaan</button>
      <button class="nav-btn" data-page="customers">👩‍🍳 Pelanggan</button>
    </aside>
    <main class="main" id="mainContent"></main>
  </div>
</div>

<div id="modalRoot"></div>

<script>
const SUPABASE_URL = 'https://zbanivcgtrpmhzzpfdlm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nEQ6gUf5e9pZe_-YfnDbiA_W09oA7rD';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentPage = 'dashboard';
let cached = {products:[], ingredients:[], sales:[], expenses:[], customers:[]};

const configs = {
  products: {
    title:'Produk', table:'products', icon:'🍰',
    fields:[
      {key:'name',label:'Nama produk',required:true},
      {key:'category',label:'Kategori',type:'select',options:['Cheesekut','Kek moist','Kek batik','Lain-lain']},
      {key:'price',label:'Harga jual (RM)',type:'number',required:true,min:0,step:'0.01'},
      {key:'description',label:'Penerangan',type:'textarea'}
    ],
    columns:[['name','Nama produk'],['category','Kategori'],['price','Harga jual'],['description','Penerangan']]
  },
  ingredients: {
    title:'Stok bahan',table:'ingredients',icon:'📦',
    fields:[
      {key:'name',label:'Nama bahan',required:true},
      {key:'quantity',label:'Kuantiti semasa',type:'number',required:true,min:0,step:'any'},
      {key:'unit',label:'Unit (g, kg, ml, pcs)',required:true},
      {key:'cost',label:'Kos (RM)',type:'number',required:true,min:0,step:'0.01'},
      {key:'minimum_stock',label:'Stok minimum',type:'number',required:true,min:0,step:'any'}
    ],
    columns:[['name','Nama bahan'],['quantity','Kuantiti'],['unit','Unit'],['cost','Kos (RM)'],['minimum_stock','Stok minimum']]
  },
  sales: {
    title:'Jualan',table:'sales',icon:'💰',
    fields:[
      {key:'sale_date',label:'Tarikh jualan',type:'date',required:true},
      {key:'customer_name',label:'Nama pelanggan'},
      {key:'product_name',label:'Nama produk',required:true},
      {key:'quantity',label:'Kuantiti',type:'number',required:true,min:1,step:'any'},
      {key:'amount',label:'Jumlah jualan (RM)',type:'number',required:true,min:0,step:'0.01'},
      {key:'notes',label:'Catatan',type:'textarea'}
    ],
    columns:[['sale_date','Tarikh'],['customer_name','Pelanggan'],['product_name','Produk'],['quantity','Kuantiti'],['amount','Jumlah (RM)'],['notes','Catatan']]
  },
  expenses: {
    title:'Perbelanjaan',table:'expenses',icon:'🧾',
    fields:[
      {key:'expense_date',label:'Tarikh perbelanjaan',type:'date',required:true},
      {key:'description',label:'Butiran perbelanjaan',required:true},
      {key:'category',label:'Kategori'},
      {key:'amount',label:'Jumlah (RM)',type:'number',required:true,min:0,step:'0.01'},
      {key:'notes',label:'Catatan',type:'textarea'}
    ],
    columns:[['expense_date','Tarikh'],['description','Butiran'],['category','Kategori'],['amount','Jumlah (RM)'],['notes','Catatan']]
  },
  customers: {
    title:'Pelanggan',table:'customers',icon:'👩‍🍳',
    fields:[
      {key:'name',label:'Nama pelanggan',required:true},
      {key:'phone',label:'Nombor telefon',type:'tel'},
      {key:'address',label:'Alamat',type:'textarea'},
      {key:'notes',label:'Catatan',type:'textarea'}
    ],
    columns:[['name','Nama'],['phone','Telefon'],['address','Alamat'],['notes','Catatan']]
  }
};

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function money(value) {
  return 'RM ' + Number(value || 0).toLocaleString('ms-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function showNotice(elementId,message,type='error') {
  const el=document.getElementById(elementId);
  if(el) el.innerHTML=`<div class="notice ${type}">${esc(message)}</div>`;
}
function setLoading(button,loading,label) {
  button.disabled=loading;
  button.textContent=loading?'Sila tunggu…':label;
}
function closeMenu() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
  document.getElementById('menuToggle').setAttribute('aria-expanded','false');
}
document.getElementById('menuToggle').addEventListener('click',()=>{
  const side=document.getElementById('sidebar');
  const open=!side.classList.contains('open');
  side.classList.toggle('open',open);
  document.getElementById('backdrop').classList.toggle('show',open);
  document.getElementById('menuToggle').setAttribute('aria-expanded',String(open));
});
document.getElementById('backdrop').addEventListener('click',closeMenu);

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    currentPage=btn.dataset.page;
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b===btn));
    closeMenu();
    loadPage();
  });
});

document.getElementById('authForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('loginBtn');
  setLoading(btn,true,'Log masuk');
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const {error}=await db.auth.signInWithPassword({email,password});
  setLoading(btn,false,'Log masuk');
  if(error) showNotice('authNotice',error.message);
});
document.getElementById('registerBtn').addEventListener('click',async()=>{
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  if(!email||password.length<6) {
    showNotice('authNotice','Masukkan e-mel yang sah dan kata laluan sekurang-kurangnya 6 aksara.');
    return;
  }
  const btn=document.getElementById('registerBtn');
  setLoading(btn,true,'Daftar akaun baharu');
  const {data,error}=await db.auth.signUp({email,password});
  setLoading(btn,false,'Daftar akaun baharu');
  if(error) showNotice('authNotice',error.message);
  else if(data.session) showNotice('authNotice','Akaun berjaya didaftarkan.','success');
  else showNotice('authNotice','Pendaftaran diterima. Semak e-mel untuk pengesahan jika diminta.','success');
});
document.getElementById('logoutBtn').addEventListener('click',async()=>{
  await db.auth.signOut();
});

db.auth.onAuthStateChange((_event,session)=>{
  currentUser=session?.user||null;
  document.getElementById('loginPage').classList.toggle('hidden',!!currentUser);
  document.getElementById('appPage').classList.toggle('hidden',!currentUser);
  if(currentUser){
    document.getElementById('userEmail').textContent=currentUser.email||'';
    loadPage();
  }
});

async function fetchRows(table) {
  const {data,error}=await db.from(table).select('*').order('created_at',{ascending:false});
  if(error) throw error;
  return data||[];
}
async function loadPage() {
  const main=document.getElementById('mainContent');
  main.innerHTML='<div class="panel">Sedang memuatkan data…</div>';
  if(currentPage==='dashboard') {
    try {
      const names=['products','ingredients','sales','expenses','customers'];
      const results=await Promise.all(names.map(fetchRows));
      names.forEach((n,i)=>cached[n]=results[i]);
      renderDashboard();
    } catch(e) {
      main.innerHTML=`<div class="panel"><h2>Data belum dapat dimuatkan</h2><p>${esc(e.message)}</p><p>Semak nama lajur, akses Supabase dan polisi RLS. Data tidak dipadam.</p><button class="btn btn-primary" onclick="loadPage()">Cuba lagi</button></div>`;
    }
    return;
  }
  try {
    cached[currentPage]=await fetchRows(configs[currentPage].table);
    renderTable(currentPage);
  } catch(e) {
    main.innerHTML=`<div class="panel"><h2>Tak dapat memuatkan ${esc(configs[currentPage].title)}</h2><p>${esc(e.message)}</p><p>Pastikan jadual dan nama lajur sepadan dengan kod ini serta polisi RLS membenarkan pengguna membaca datanya.</p><button class="btn btn-primary" onclick="loadPage()">Cuba lagi</button></div>`;
  }
}
function renderDashboard() {
  const salesTotal=cached.sales.reduce((s,r)=>s+Number(r.amount||0),0);
  const expensesTotal=cached.expenses.reduce((s,r)=>s+Number(r.amount||0),0);
  document.getElementById('mainContent').innerHTML=`
    <h1 class="page-title">Dashboard 🌸</h1>
    <p class="subtitle">Selamat datang ke ruang pengurusan Manisan by Asyud.</p>
    <div class="cards">
      <div class="stat"><div class="stat-label">Jumlah produk</div><div class="stat-value">${cached.products.length}</div></div>
      <div class="stat"><div class="stat-label">Jenis bahan</div><div class="stat-value">${cached.ingredients.length}</div></div>
      <div class="stat"><div class="stat-label">Rekod pelanggan</div><div class="stat-value">${cached.customers.length}</div></div>
      <div class="stat"><div class="stat-label">Jumlah jualan direkod</div><div class="stat-value">${money(salesTotal)}</div></div>
      <div class="stat"><div class="stat-label">Jumlah perbelanjaan</div><div class="stat-value">${money(expensesTotal)}</div></div>
      <div class="stat"><div class="stat-label">Baki jualan − belanja</div><div class="stat-value">${money(salesTotal-expensesTotal)}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Selamat datang 💗</h2></div>
      <p>Gunakan menu ☰ untuk mengurus produk, stok bahan, jualan, perbelanjaan dan pelanggan.</p>
      <p style="color:var(--muted);font-size:13px">Jumlah jualan dan perbelanjaan ialah jumlah semua rekod yang tersedia, bukan semestinya bulan semasa.</p>
    </div>`;
}
function renderTable(page) {
  const cfg=configs[page], rows=cached[page]||[];
  const headers=cfg.columns.map(c=>`<th>${esc(c[1])}</th>`).join('');
  const body=rows.length?rows.map(r=>`<tr>
    ${cfg.columns.map(([key])=>`<td>${key==='price'||key==='amount'||key==='cost'?money(r[key]):esc(r[key]??'—')}</td>`).join('')}
    <td class="actions">
      <button class="btn btn-light btn-small" onclick="editRow('${page}','${esc(r.id)}')">Edit</button>
      <button class="btn btn-danger btn-small" onclick="deleteRow('${page}','${esc(r.id)}')">Padam</button>
    </td></tr>`).join(''):`<tr><td colspan="${cfg.columns.length+1}" class="empty">Belum ada rekod. Tekan “Tambah” untuk mula.</td></tr>`;
  document.getElementById('mainContent').innerHTML=`
    <h1 class="page-title">${cfg.icon} ${esc(cfg.title)}</h1>
    <p class="subtitle">Urus dan kemas kini maklumat ${esc(cfg.title.toLowerCase())} anda.</p>
    <section class="panel">
      <div class="panel-head">
        <h2>Senarai ${esc(cfg.title)}</h2>
        <button class="btn btn-primary" onclick="openForm('${page}')">＋ Tambah</button>
      </div>
      <div class="table-wrap"><table><thead><tr>${headers}<th>Tindakan</th></tr></thead><tbody>${body}</tbody></table></div>
    </section>`;
}
function openForm(page,row=null) {
  const cfg=configs[page];
  const isEdit=!!row;
  const fields=cfg.fields.map(f=>{
    const value=row?.[f.key]??(f.type==='date'?today():(f.key==='quantity'?1:(f.key==='minimum_stock'?0:'')));
    const required=f.required?'required':'';
    let control='';
    if(f.type==='select') {
      control=`<select id="field_${f.key}" ${required}>${f.options.map(o=>`<option ${value===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    } else if(f.type==='textarea') {
      control=`<textarea id="field_${f.key}" ${required}>${esc(value)}</textarea>`;
    } else {
      control=`<input id="field_${f.key}" type="${f.type||'text'}" value="${esc(value)}" ${required} ${f.min!==undefined?`min="${f.min}"`:''} ${f.step?`step="${f.step}"`:''}>`;
    }
    return `<div class="field ${f.type==='textarea'?'full':''}"><label for="field_${f.key}">${esc(f.label)}${f.required?' *':''}</label>${control}</div>`;
  }).join('');
  document.getElementById('modalRoot').innerHTML=`
    <div class="overlay" id="formOverlay">
      <section class="modal">
        <h2>${isEdit?'✏️ Edit':'＋ Tambah'} ${esc(cfg.title)}</h2>
        <form id="recordForm">
          <div class="form-grid">${fields}</div>
          <div id="formNotice"></div>
          <div class="form-actions">
            <button class="btn btn-light" type="button" onclick="closeForm()">Batal</button>
            <button class="btn btn-primary" type="submit" id="saveBtn">Simpan</button>
          </div>
        </form>
      </section>
    </div>`;
  document.getElementById('formOverlay').addEventListener('click',e=>{
    if(e.target.id==='formOverlay') closeForm();
  });
  document.getElementById('recordForm').addEventListener('submit',e=>saveRow(e,page,row));
}
function closeForm(){document.getElementById('modalRoot').innerHTML='';}
function editRow(page,id) {
  const row=(cached[page]||[]).find(r=>String(r.id)===String(id));
  if(!row) return alert('Rekod tidak ditemui. Muat semula senarai.');
  openForm(page,row);
}
async function saveRow(event,page,row) {
  event.preventDefault();
  const cfg=configs[page], payload={};
  for(const f of cfg.fields) {
    const el=document.getElementById('field_'+f.key);
    let value=el.value.trim();
    if(f.type==='number') value=value===''?null:Number(value);
    payload[f.key]=value;
  }
  if(!currentUser) return showNotice('formNotice','Sila log masuk semula.');
  payload.user_id=currentUser.id;
  const btn=document.getElementById('saveBtn');
  setLoading(btn,true,'Simpan');
  let query;
  if(row) query=db.from(cfg.table).update(payload).eq('id',row.id).eq('user_id',currentUser.id);
  else query=db.from(cfg.table).insert(payload);
  const {error}=await query;
  setLoading(btn,false,'Simpan');
  if(error) {
    showNotice('formNotice',error.message);
    return;
  }
  closeForm();
  await loadPage();
}
async function deleteRow(page,id) {
  const cfg=configs[page];
  if(!confirm(`Padam rekod ini daripada ${cfg.title}? Tindakan ini tidak boleh dibatalkan.`)) return;
  const {error}=await db.from(cfg.table).delete().eq('id',id).eq('user_id',currentUser.id);
  if(error) {
    alert('Tidak berjaya memadam: '+error.message);
    return;
  }
  await loadPage();
}

db.auth.getSession().then(({data})=>{
  const session=data?.session;
  if(session) {
    currentUser=session.user;
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('appPage').classList.remove('hidden');
    document.getElementById('userEmail').textContent=currentUser.email||'';
    loadPage();
  }
});
</script>
</body>
