

<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff0f5">
<meta name="apple-mobile-web-app-title" content="Manisan by Asyud">
<link rel="apple-touch-icon" href="./34B38BDA-D2FF-4E56-97B5-63321CBE6B63.png">
<title>Manisan by Asyud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style> 
:root{--pink:#e98eae;--dark:#c95783;--light:#fff0f5;--cream:#fffaf8;--text:#49333d;--muted:#927c86;--border:#f2dce5;--danger:#c84355}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--text);font-family:Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}
.topbar{height:64px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 14px;position:sticky;top:0;z-index:20}
.brand{font-weight:800;color:var(--dark);flex:1}.hamburger{border:0;background:var(--light);color:var(--dark);padding:9px 13px;border-radius:10px;font-size:22px}
.user-label{font-size:12px;color:var(--muted)}
.app{display:flex;min-height:calc(100vh - 64px)}.sidebar{width:240px;background:white;border-right:1px solid var(--border);padding:16px 12px;flex-shrink:0}
.side-heading{font-size:11px;color:var(--muted);padding:10px}
.nav-btn{width:100%;border:0;background:transparent;text-align:left;padding:12px;margin:3px 0;border-radius:10px;color:var(--text)}
.nav-btn.active,.nav-btn:hover{background:var(--light);color:var(--dark);font-weight:bold}
.main{flex:1;min-width:0;padding:22px;max-width:1500px;margin:auto;width:100%}
.page-title{font-size:25px;margin:0 0 7px}.subtitle{font-size:13px;color:var(--muted);margin:0 0 20px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat,.panel{background:white;border:1px solid var(--border);border-radius:15px;padding:17px;margin-bottom:16px;box-shadow:0 5px 20px #d99db515}
.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:22px;color:var(--dark);font-weight:bold;margin-top:10px;overflow-wrap:anywhere}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.panel-head h2{font-size:17px;margin:0}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:bold}
.btn-primary{background:var(--dark);color:white}.btn-light{background:var(--light);color:var(--dark)}.btn-danger{background:#fff0f0;color:var(--danger)}
.btn-small{padding:6px 9px;font-size:12px;margin:2px}.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:530px;font-size:13px}
th,td{padding:11px 9px;text-align:left;border-bottom:1px solid #f5e7ed;vertical-align:top}
th{background:#fff8fb;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:24px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:bold}
.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;background:white;color:var(--text)}
.field textarea{min-height:75px}.form-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(140deg,#fff0f5,#fffaf8)}
.login-card{background:white;padding:26px;border-radius:20px;width:100%;max-width:420px;border:1px solid var(--border)}
.login-card h1{color:var(--dark);font-size:24px}.login-card p{font-size:13px;color:var(--muted);line-height:1.6}
.login-card .btn{width:100%;margin-top:8px}.notice{padding:11px;border-radius:9px;margin:10px 0;font-size:13px;overflow-wrap:anywhere}
.error{background:#fff0f0;color:#a52d40}.success{background:#eefaf1;color:#247443}
.overlay{position:fixed;inset:0;background:#38232d66;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.modal{background:white;border-radius:17px;padding:20px;width:100%;max-width:650px;max-height:92vh;overflow:auto}
.modal h2{margin-top:0}.backdrop{display:none}

/* INVOIS DALAM APLIKASI */
.invoice-screen{max-width:900px;margin:0 auto}
.invoice-actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.invoice-paper{background:white;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 8px 30px #6b3b4b10}
.invoice-accent{height:9px;background:linear-gradient(90deg,#c95783,#f0b5cc,#fff0f5)}
.invoice-inner{padding:clamp(18px,5vw,48px)}
.invoice-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.invoice-logo{font-size:27px;font-weight:800;color:var(--dark);letter-spacing:-.6px}
.invoice-tagline{font-size:12px;color:var(--muted);margin-top:7px}
.invoice-title{font-size:28px;letter-spacing:2px;color:var(--dark);font-weight:800;text-align:right}
.invoice-meta{font-size:12px;line-height:1.9;color:var(--muted);text-align:right;margin-top:9px;overflow-wrap:anywhere}
.invoice-rule{border:0;border-top:1px solid var(--border);margin:27px 0}
.invoice-info{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.invoice-label{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:bold}
.invoice-value{font-size:15px;font-weight:bold;line-height:1.6;overflow-wrap:anywhere}
.invoice-muted{font-size:12px;color:var(--muted);line-height:1.8;overflow-wrap:anywhere}
.invoice-table{width:100%;min-width:0;margin:26px 0;font-size:13px}
.invoice-table th{background:#fff0f5;color:var(--dark);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.invoice-table th,.invoice-table td{padding:14px 12px}
.invoice-right{text-align:right;white-space:nowrap}
.invoice-summary{width:100%;max-width:370px;margin:0 0 0 auto;min-width:0}
.invoice-summary td{padding:10px 5px;border-bottom:1px solid #f5e7ed}
.invoice-summary .balance-row td{border-top:2px solid var(--dark);border-bottom:0;padding-top:16px;color:var(--dark);font-size:18px;font-weight:bold}
.invoice-note{margin-top:28px;background:#fff8fb;border:1px solid var(--border);border-radius:10px;padding:16px;font-size:12px;line-height:1.8}
.invoice-footer{text-align:center;border-top:1px solid var(--border);margin-top:35px;padding-top:20px;color:var(--muted);font-size:12px;line-height:1.8}
.invoice-status{display:inline-block;border-radius:30px;padding:5px 10px;background:#fff0f5;color:var(--dark);font-size:11px;font-weight:bold}
.invoice-screen .btn{min-height:42px}
.print-hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
@media(max-width:760px){
 .topbar{height:60px;padding:0 9px}.brand{font-size:14px}.user-label{display:none}
 .sidebar{position:fixed;z-index:30;top:60px;bottom:0;left:0;width:270px;transform:translateX(-105%);transition:transform .2s;overflow:auto;background:white}
 .sidebar.open{transform:translateX(0);box-shadow:10px 0 30px #0001}
 .backdrop.show{display:block;position:fixed;inset:60px 0 0;z-index:25;background:#38232d55}
 .main{padding:14px 10px}.page-title{font-size:22px}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat,.panel{padding:12px}.stat-value{font-size:18px}
 .form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
 .invoice-top{flex-direction:column;gap:18px}.invoice-title,.invoice-meta{text-align:left}
 .invoice-info{grid-template-columns:1fr;gap:18px}.invoice-logo{font-size:23px}.invoice-title{font-size:25px}
 .invoice-inner{padding:19px 15px}.invoice-table th,.invoice-table td{padding:10px 7px;font-size:12px}
 .invoice-table{font-size:12px}.invoice-actions .btn{flex:1}
}
@media(max-width:360px){.cards{grid-template-columns:1fr}}
@media print{
 @page{size:A4;margin:12mm}
 body{background:white!important}
 body *{visibility:hidden!important}
 #mainContent,#mainContent *{visibility:visible!important}
 #mainContent{position:absolute!important;left:0!important;top:0!important;width:100%!important;max-width:none!important;margin:0!important;padding:0!important}
 .no-print,.invoice-actions,.topbar,.sidebar,.backdrop,.panel-head,.print-hint{display:none!important}
 .invoice-screen{max-width:none!important;margin:0!important}
 .invoice-paper{box-shadow:none!important;border:0!important;border-radius:0!important;overflow:visible!important}
 .invoice-inner{padding:0!important}
 .invoice-accent{height:5px!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .invoice-table th,.invoice-note,.invoice-status{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .invoice-footer{break-inside:avoid}
}
</style>
</head>
<body>
<div id="loginPage" class="login-page"><div class="login-card">
<h1>🍰 Manisan by Asyud</h1><p>Sistem pengurusan perniagaan manisan anda.</p><div id="authNotice"></div>
<form id="authForm">
<div class="field"><label>E-mel</label><input id="authEmail" type="email" required autocomplete="email"></div>
<div class="field"><label>Kata laluan</label><input id="authPassword" type="password" required minlength="6" autocomplete="current-password"></div>
<button class="btn btn-primary" id="loginBtn">Log masuk</button>
<button class="btn btn-light" type="button" id="registerBtn">Daftar akaun baharu</button>
</form></div></div>
<div id="appPage" class="hidden">
<header class="topbar"><button class="hamburger" id="menuToggle">☰</button><div class="brand">🍰 Manisan by Asyud</div><span class="user-label" id="userEmail"></span><button class="btn btn-light" id="logoutBtn">Keluar</button></header>
<div class="backdrop" id="backdrop"></div>
<div class="app"><aside class="sidebar" id="sidebar"><div class="side-heading">MENU UTAMA</div>
<button class="nav-btn active" data-page="dashboard">🏠 Dashboard</button>
<button class="nav-btn" data-page="products">🍰 Produk & Untung</button>
<button class="nav-btn" data-page="bookings">📋 Tempahan</button>
<button class="nav-btn" data-page="sales">💰 Jualan</button>
<button class="nav-btn" data-page="ingredients">📦 Stok bahan</button>
<button class="nav-btn" data-page="recipes">📖 Resipi</button>
<button class="nav-btn" data-page="invoices">🧾 Resit & Invois</button>
<button class="nav-btn" data-page="expenses">💳 Perbelanjaan</button>
<button class="nav-btn" data-page="reports">📊 Laporan dan keuntungan</button>
<button class="nav-btn" data-page="customers">👩‍🍳 Pelanggan</button>
</aside><main class="main" id="mainContent"></main></div></div>
<div id="modalRoot"></div>
<script>
const SUPABASE_URL='https://zbanivcgtrpmhzzpfdlm.supabase.co';
const SUPABASE_KEY='sb_publishable_nEQ6gUf5e9pZe_-YfnDbiA_W09oA7rD';
const VENDOR_COMMISSION_RATE=0.20;
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentPage='dashboard',invoiceReturnPage='invoices',currentInvoiceId=null,currentInvoiceType='invoice';
let cached={products:[],ingredients:[],sales:[],expenses:[],customers:[],bookings:[]};
const $=id=>document.getElementById(id);
const mainContent=$('mainContent'),modalRoot=$('modalRoot');
const configs={
products:{title:'Produk & Untung',table:'products',icon:'🍰',fields:[['name','Nama produk','text'],['selling_price','Harga jual (RM)','number'],['cost_price','Modal seunit (RM)','number'],['stock_quantity','Stok produk','number']],cols:[['name','Produk'],['selling_price','Harga jual'],['cost_price','Modal'],['stock_quantity','Stok']]}, 
ingredients:{title:'Stok bahan',table:'ingredients',icon:'📦',fields:[['name','Nama bahan','text'],['package_count','Bilangan pek dibeli','number'],['package_quantity','Berat/isi setiap pek','number'],['package_unit','Unit pek (g, kg, ml, pcs)','text'],['package_cost','Harga satu pek (RM)','number'],['quantity','Stok semasa','number'],['unit','Unit stok (g, kg, ml, pcs)','text'],['cost','Kos seunit (RM)','number'],['minimum_stock','Stok minimum','number']],cols:[['name','Bahan'],['quantity','Stok semasa'],['unit','Unit'],['cost','Kos seunit'],['minimum_stock','Minimum']]} 
sales:{title:'Jualan',table:'sales',icon:'💰',fields:[['sale_date','Tarikh jualan','date'],['customer_name','Nama pelanggan','text'],['product_name','Nama produk','text'],['quantity','Kuantiti','number'],['amount','Jumlah jualan (RM)','number'],['notes','Catatan','textarea']],cols:[['sale_date','Tarikh'],['customer_name','Pelanggan'],['product_name','Produk'],['quantity','Kuantiti'],['amount','Jumlah'],['notes','Catatan']]},
expenses:{title:'Perbelanjaan',table:'expenses',icon:'💳',fields:[['expense_date','Tarikh perbelanjaan','date'],['description','Butiran','text'],['category','Kategori','text'],['amount','Jumlah (RM)','number'],['notes','Catatan','textarea']],cols:[['expense_date','Tarikh'],['description','Butiran'],['category','Kategori'],['amount','Jumlah'],['notes','Catatan']]},
customers:{title:'Pelanggan',table:'customers',icon:'👩‍🍳',fields:[['name','Nama pelanggan','text'],['phone','Telefon','tel'],['address','Alamat','textarea'],['notes','Catatan','textarea']],cols:[['name','Nama'],['phone','Telefon'],['address','Alamat'],['notes','Catatan']]}
};
const bookingFields=[['customer_name','Nama pelanggan','text'],['phone','Telefon','tel'],['product_name','Produk','text'],['quantity','Kuantiti','number'],['order_date','Tarikh tempahan','date'],['due_date','Tarikh siap','date'],['total_amount','Jumlah harga (RM)','number'],['deposit_amount','Deposit (RM)','number'],['status','Status','select'],['notes','Catatan','textarea']];
const bookingCols=[['customer_name','Pelanggan'],['phone','Telefon'],['product_name','Produk'],['quantity','Kuantiti'],['order_date','Tarikh tempahan'],['due_date','Tarikh siap'],['total_amount','Jumlah'],['deposit_amount','Deposit'],['status','Status'],['notes','Catatan']];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return 'RM '+Number(v||0).toLocaleString('ms-MY',{minimumFractionDigits:2,maximumFractionDigits:2});}
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function notice(id,msg,type='error'){let e=$(id);if(e)e.innerHTML=`<div class="notice ${type}">${esc(msg)}</div>`;}
function closeForm(){modalRoot.innerHTML='';}
function closeMenu(){sidebar.classList.remove('open');backdrop.classList.remove('show');}
const sidebar=$('sidebar'),backdrop=$('backdrop');
$('menuToggle').onclick=()=>{sidebar.classList.toggle('open');backdrop.classList.toggle('show')};
backdrop.onclick=closeMenu;
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{currentPage=b.dataset.page;document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x===b));closeMenu();loadPage();});
$('authForm').onsubmit=async e=>{e.preventDefault();let b=$('loginBtn');b.disabled=true;let {error}=await db.auth.signInWithPassword({email:$('authEmail').value.trim(),password:$('authPassword').value});b.disabled=false;if(error)notice('authNotice',error.message);};
$('registerBtn').onclick=async()=>{let email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||password.length<6)return notice('authNotice','Masukkan e-mel sah dan kata laluan minimum 6 aksara.');let {data,error}=await db.auth.signUp({email,password});if(error)notice('authNotice',error.message);else notice('authNotice',data.session?'Akaun berjaya didaftarkan.':'Semak e-mel jika pengesahan diperlukan.','success');};
$('logoutBtn').onclick=()=>db.auth.signOut();
db.auth.onAuthStateChange((_event,session)=>showSession(session));
function showSession(session){currentUser=session?.user||null;$('loginPage').classList.toggle('hidden',!!currentUser);$('appPage').classList.toggle('hidden',!currentUser);if(currentUser){$('userEmail').textContent=currentUser.email||'';loadPage();}}
db.auth.getSession().then(({data})=>showSession(data.session));
async function fetchRows(table){let {data,error}=await db.from(table).select('*').order('created_at',{ascending:false});if(error)throw error;return data||[];}
async function loadPage(){
mainContent.innerHTML='<section class="panel">Memuatkan data…</section>';
if(!currentUser)return;
if(currentPage==='dashboard'){let names=['products','ingredients','sales','expenses','customers'];let res=await Promise.allSettled(names.map(fetchRows));names.forEach((n,i)=>cached[n]=res[i].status==='fulfilled'?res[i].value:[]);renderDashboard();return;}
if(currentPage==='bookings'){try{cached.bookings=await fetchRows('bookings');renderBookings();}catch(e){errorPage(e.message)}return;}
if(currentPage==='recipes'){loadRecipesPage();return;}
if(currentPage==='invoices'){loadInvoicesPage();return;}
if(currentPage==='reports'){try{[cached.products,cached.sales,cached.expenses]=await Promise.all(['products','sales','expenses'].map(fetchRows));renderReports();}catch(e){errorPage(e.message)}return;}
let cfg=configs[currentPage];if(!cfg)return;
try{cached[currentPage]=await fetchRows(cfg.table);renderTable(currentPage);}catch(e){errorPage(e.message);}
}
function errorPage(msg){mainContent.innerHTML=`<section class="panel"><div class="notice error">${esc(msg)}</div><button class="btn btn-primary" onclick="loadPage()">Cuba lagi</button></section>`;}
function commissionOfSale(s){return isVendorSale(s)?Number(s.amount||0)*VENDOR_COMMISSION_RATE:0;}
function isVendorSale(s){return String(s.notes||'').includes('[SALURAN:VENDOR]');}
function cleanSaleNotes(s){return String(s.notes||'').replace(/\[SALURAN:(VENDOR|BIASA)\]\s*/g,'').trim();}
function renderDashboard(){
let sales=cached.sales.reduce((s,r)=>s+Number(r.amount||0),0),comm=cached.sales.reduce((s,r)=>s+commissionOfSale(r),0),expenses=cached.expenses.reduce((s,r)=>s+Number(r.amount||0),0);
mainContent.innerHTML=`<h1 class="page-title">Dashboard 🌸</h1><p class="subtitle">Selamat datang ke Manisan by Asyud.</p><div class="cards">
${[['Jumlah produk',cached.products.length],['Jenis bahan',cached.ingredients.length],['Pelanggan',cached.customers.length],['Jualan kasar',money(sales)],['Komisen vendor',money(comm)],['Jualan selepas komisen',money(sales-comm)],['Perbelanjaan',money(expenses)],['Jualan − komisen − perbelanjaan',money(sales-comm-expenses)]].map(([a,b])=>`<div class="stat"><div class="stat-label">${a}</div><div class="stat-value">${b}</div></div>`).join('')}
</div><section class="panel"><h2>Selamat datang 💗</h2><p>Gunakan menu untuk mengurus produk, tempahan, resipi, jualan dan kewangan.</p><p class="subtitle">Komisen vendor 20% dikira hanya untuk rekod jualan yang ditandakan sebagai vendor.</p></section>`;
}
function renderTable(page){
let c=configs[page],rows=cached[page]||[];
mainContent.innerHTML=`<h1 class="page-title">${c.icon} ${c.title}</h1><p class="subtitle">Urus ${c.title.toLowerCase()} anda.</p><section class="panel"><div class="panel-head"><h2>Senarai ${c.title}</h2><button class="btn btn-primary" onclick="openRecord('${page}')">＋ Tambah</button></div><div class="table-wrap"><table><thead><tr>${c.cols.map(x=>`<th>${x[1]}</th>`).join('')}${page==='products'?'<th>Untung seunit</th>':''}<th>Tindakan</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${c.cols.map(([k])=>`<td>${['selling_price','cost_price','cost','amount'].includes(k)?money(r[k]):k==='notes'&&page==='sales'?esc(cleanSaleNotes(r)||'—'):esc(r[k]??'—')}</td>`).join('')}${page==='products'?`<td>${money(Number(r.selling_price||0)-Number(r.cost_price||0))}</td>`:''}<td><button class="btn btn-light btn-small" onclick="openRecord('${page}','${esc(r.id)}')">Edit</button><button class="btn btn-danger btn-small" onclick="deleteRecord('${page}','${esc(r.id)}')">Padam</button></td></tr>`).join(''):`<tr><td colspan="${c.cols.length+(page==='products'?2:1)}" class="empty">Belum ada rekod.</td></tr>`}</tbody></table></div></section>`;
}
function renderBookings(){
mainContent.innerHTML=`<h1 class="page-title">📋 Tempahan</h1><p class="subtitle">Urus tempahan pelanggan.</p><section class="panel"><div class="panel-head"><h2>Senarai tempahan</h2><button class="btn btn-primary" onclick="openBooking()">＋ Tambah tempahan</button></div><div class="table-wrap"><table><thead><tr>${bookingCols.map(x=>`<th>${x[1]}</th>`).join('')}<th>Tindakan</th></tr></thead><tbody>${cached.bookings.length?cached.bookings.map(r=>`<tr>${bookingCols.map(([k])=>`<td>${['total_amount','deposit_amount'].includes(k)?money(r[k]):esc(r[k]??'—')}</td>`).join('')}<td><button class="btn btn-light btn-small" onclick="openBooking('${esc(r.id)}')">Edit</button><button class="btn btn-danger btn-small" onclick="deleteBooking('${esc(r.id)}')">Padam</button></td></tr>`).join(''):`<tr><td colspan="11" class="empty">Belum ada tempahan.</td></tr>`}</tbody></table></div></section>`;
}
function fieldsHtml(fields,row={}){
return fields.map(f=>{let [k,label,type]=f,v=row[k]??(type==='date'?today():k==='status'?'Pending':k==='quantity'?1:k.includes('amount')?0:'');let control=type==='textarea'?`<textarea id="f_${k}">${esc(v)}</textarea>`:type==='select'?`<select id="f_${k}">${['Pending','In Progress','Completed','Cancelled'].map(s=>`<option ${v===s?'selected':''}>${s}</option>`).join('')}</select>`:`<input id="f_${k}" type="${type}" value="${esc(v)}" ${type==='number'?'min="0" step="any"':''} ${!['notes','address','phone','category','customer_name'].includes(k)?'required':''}>`;return `<div class="field ${type==='textarea'?'full':''}"><label>${label}</label>${control}</div>`;}).join('');
}
function openRecord(page,id=null){
let c=configs[page],row=id?(cached[page]||[]).find(x=>String(x.id)===String(id)):null;

          </div>

      </form>

<h2>Senarai bahan resipi</h2>

  onclick="makeRecipeBatch('${r.id}')">

  let stockItems=stockResult.data||[];

  select.innerHTML='<option value="">Pilih bahan</option>'+

      `<option value="${esc(x.id)}">${esc(x.name)} — stok: ${esc(x.quantity??0)} ${esc(x.unit||'')}</option>`
    ).join('');

  select.onchange=()=>{
    let item=stockItems.find(x=>String(x.id)===String(select.value));
    $('inUnit').value=item?.unit||'';
  };

  $('ingredientForm').onsubmit=async e=>{
    e.preventDefault();

    let qty=Number($('inQty').value);

    if(!item)return notice('inNotice','Sila pilih bahan daripada stok.');

    let {error}=await db.from('recipe_ingredients').insert({
      user_id:currentUser.id,

      ingredient_id:item.id,
      ingredient_name:item.name,
      quantity:qty,
      unit:item.unit||'',
      cost_per_unit:Number(item.cost||0)
    });

    $('inQty').value='';
    $('inIngredient').value='';

    await refreshRecipeIngredients(id);
  };

async function refreshRecipeIngredients(id){
  let {data,error}=await db.from('recipe_ingredients')
    .select('*')
    .eq('user_id',currentUser.id)
    .eq('recipe_id',id)
    .order('created_at');

  if(error){
    notice('ingredientList',error.message);
    return;
  }

async function makeRecipeBatch(recipeId){
  let answer=prompt('Berapa adunan yang awak buat?', '1');
  if(answer===null)return;

  let batches=Number(answer);

  if(!Number.isFinite(batches)||batches<=0||batches>1000){
    alert('Masukkan bilangan adunan yang sah.');
    return;
  }

  if(!confirm(
    'Sahkan buat '+batches+' adunan? Stok semua bahan akan ditolak.'
  ))return;

  let {data,error}=await db.rpc('use_recipe_stock',{
    p_recipe_id:recipeId,
    p_batch_count:batches
  });

  if(error){
    alert('Stok tidak berjaya ditolak: '+error.message);
    return;
  } 
  alert(data||'Stok berjaya dikemas kini.');

  await refreshRecipeIngredients(recipeId);
}

  let rows=data||[];
  let total=0;

  let stockResult=await db.from('ingredients')
    .select('id,name,unit,quantity,cost')
    .eq('user_id',currentUser.id);

  if(stockResult.error){
    notice('ingredientList','Gagal membaca stok: '+stockResult.error.message);
    return;
  }

  let stockItems=stockResult.data||[];

  rows=rows.map(x=>{
    let item=stockItems.find(s=>String(s.id)===String(x.ingredient_id));
    let unitCost=item?Number(item.cost||0):Number(x.cost_per_unit||0);
    let lineTotal=Number(x.quantity||0)*unitCost;
    total+=lineTotal;
    return {...x,displayCost:unitCost,lineTotal};
  });

  $('ingredientList').innerHTML=rows.length
    ?`<div class="table-wrap"><table>
      <thead><tr><th>Bahan</th><th>Kuantiti</th><th>Kos seunit</th><th>Jumlah</th><th></th></tr></thead>
      <tbody>${rows.map(x=>`<tr>
        <td>${esc(x.ingredient_name)}</td>
        <td>${esc(x.quantity)} ${esc(x.unit||'')}</td>
        <td>${money(x.displayCost)}</td>
        <td>${money(x.lineTotal)}</td>
        <td><button class="btn btn-danger btn-small" onclick="deleteRecipeIngredient('${x.id}','${id}')">Padam</button></td>
      </tr>`).join('')}</tbody>
    </table></div>`
    :'<p class="empty">Belum ada bahan.</p>';

  $('recipeTotal').textContent='Jumlah modal bahan: '+money(total);

  let {error:upErr}=await db.from('recipes')
    .update({total_cost:total})
    .eq('id',id)
    .eq('user_id',currentUser.id);

  if(upErr)alert('Modal dikira tetapi gagal dikemas kini: '+upErr.message);

  let old=recipeCache.find(x=>String(x.id)===String(id));
  if(old)old.total_cost=total;
}

/* DIKEMAS KINI: BUKA DOKUMEN DALAM TAB BARU */

function openDocumentForSafari(){
  const paper = document.querySelector('.invoice-paper');

  if (!paper) {
    alert('Invois tidak ditemui. Sila buka invois dahulu.');
    return;
  }

  const title = currentInvoiceType === 'receipt'
    ? 'Resit Manisan by Asyud'
    : 'Invois Manisan by Asyud';

  const styles = [...document.querySelectorAll('style')]
    .map(s => s.innerHTML)
    .join('\n');

  const html = `<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${title}</title>
<style>
${styles}

body {
  background: #fff;
  padding: 16px;
}

.invoice-paper {
  max-width: 800px;
  margin: 0 auto;
  box-shadow: none;
}

.toolbar {
  max-width: 800px;
  margin: 0 auto 14px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.toolbar button {
  border: 0;
  border-radius: 9px;
  padding: 12px 15px;
  background: #c95783;
  color: white;
  font-weight: bold;
}

@media print {
  @page {
    size: A4;
    margin: 12mm;
  }

  body {
    padding: 0 !important;
    background: white !important;
  }

  body * {
    visibility: visible !important;
  }

  .toolbar {
    display: none !important;
  }

  .invoice-paper {
    border: 0 !important;
    max-width: none !important;
    box-shadow: none !important;
    overflow: visible !important;
  }

  .invoice-inner {
    padding: 0 !important;
  }

  .no-print,
  .invoice-actions,
  .print-hint {
    display: none !important;
  }

  .invoice-table th,
  .invoice-note,
  .invoice-status,
  .invoice-accent {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()">🖨️ Cetak / Simpan PDF</button>
  <button onclick="history.back()">← Kembali ke aplikasi</button>
</div>
${paper.outerHTML}
</body>
</html>`;

  try {
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    // Buka paparan dokumen dalam tab yang sama
    // supaya tidak bergantung pada tetingkap pop-up.
    window.location.href = url;
  } catch (e) {
    alert('Tidak dapat membuka dokumen. Sila buka aplikasi melalui Safari dan cuba lagi.');
  }
}


/* LAPORAN KEUNTUNGAN */
function renderReports(){
let sales=cached.sales;
mainContent.innerHTML=`<h1 class="page-title">📊 Laporan dan Keuntungan</h1><p class="subtitle">Komisen vendor 20% ditolak daripada jualan vendor sahaja.</p><section class="panel"><div class="form-grid"><div class="field"><label>Dari tarikh</label><input id="startDate" type="date" value="${sales.map(x=>x.sale_date).filter(Boolean).sort()[0]||today()}"></div><div class="field"><label>Hingga tarikh</label><input id="endDate" type="date" value="${today()}"></div></div><button class="btn btn-primary" onclick="calculateReport()">Jana laporan</button></section><div id="reportResult"></div>`;
calculateReport();
}
function calculateReport(){
let start=$('startDate').value,end=$('endDate').value;if(!start||!end||start>end){$('reportResult').innerHTML='<div class="notice error">Julat tarikh tidak sah.</div>';return;}
let ss=cached.sales.filter(x=>x.sale_date>=start&&x.sale_date<=end),ee=cached.expenses.filter(x=>x.expense_date>=start&&x.expense_date<=end);
let income=ss.reduce((s,x)=>s+Number(x.amount||0),0),commission=ss.reduce((s,x)=>s+commissionOfSale(x),0);
let cost=ss.reduce((s,x)=>{let p=cached.products.find(p=>String(p.name).trim().toLowerCase()===String(x.product_name).trim().toLowerCase());return s+(p?Number(p.cost_price||0)*Number(x.quantity||0):0)},0);
let ex=ee.reduce((s,x)=>s+Number(x.amount||0),0),net=income-commission-cost-ex;
let vendorSales=ss.filter(isVendorSale).reduce((s,x)=>s+Number(x.amount||0),0),ordinarySales=income-vendorSales;
$('reportResult').innerHTML=`<div class="cards">${[['Jualan kasar',money(income)],['Jualan biasa',money(ordinarySales)],['Jualan vendor',money(vendorSales)],['Komisen vendor (20%)',money(commission)],['Modal produk terjual (anggaran)',money(cost)],['Perbelanjaan',money(ex)],['Untung bersih anggaran',money(net)]].map(([a,b])=>`<div class="stat"><div class="stat-label">${a}</div><div class="stat-value">${b}</div></div>`).join('')}</div><section class="panel"><h2>Ringkasan pengiraan</h2><p>Tempoh: ${esc(start)} hingga ${esc(end)}</p><p>Rekod jualan: ${ss.length}</p><p>Rekod jualan vendor: ${ss.filter(isVendorSale).length}</p><p>Rekod perbelanjaan: ${ee.length}</p><div class="notice success">Untung bersih anggaran = jualan kasar − komisen vendor − modal produk terjual − perbelanjaan.</div><div class="notice error">Penting: pastikan modal seunit dalam menu Produk dikemas kini. Jualan lama yang tidak ditandakan sebagai vendor akan dianggap jualan biasa. Pengiraan ini ialah anggaran berdasarkan rekod yang disimpan.</div></section>`;
}
</script>
</body>
</html>
